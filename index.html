
<!DOCTYPE html>
<html>
<head>
    <title>Wii Menu</title>
    <style>
        body {
            margin: 0;
            background: #a9e8f5;
            font-family: Arial;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            padding: 25px;
            height: 80vh;
        }

        .channel {
            background: white;
            border: 3px solid #aaa;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
        }

        .channel:hover {
            border-color: #5cc8ee;
        }

        .icon {
            font-size: 40px;
        }

        .name {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="menu" id="menu"></div>

<script>
// Change your channels here
const channels = [
    { name: "Internet Channel", icon: "🌐", url: "https://google.com" },
    { name: "Game Channel", icon: "🎮", url: "https://example.com" },
    { name: "Music Channel", icon: "🎵", url: "https://youtube.com" },
    { name: "Video Channel", icon: "📺", url: "https://example.com" },

    { name: "Photos", icon: "📷", url: "https://example.com" },
    { name: "News Channel", icon: "📰", url: "https://example.com" },
    { name: "Weather", icon: "☀️", url: "https://example.com" },
    { name: "Channel 8", icon: "❔", url: "https://example.com" },

    { name: "Channel 9", icon: "❔", url: "https://example.com" },
    { name: "Channel 10", icon: "❔", url: "https://example.com" },
    { name: "Channel 11", icon: "❔", url: "https://example.com" },
    { name: "Channel 12", icon: "❔", url: "https://example.com" }
];

const menu = document.getElementById("menu");

channels.forEach(channel => {
    const button = document.createElement("div");
    button.className = "channel";

    button.innerHTML = `
        <div class="icon">${channel.icon}</div>
        <div class="name">${channel.name}</div>
    `;

    button.onclick = () => {
        window.open(channel.url, "_blank");
    };

    menu.appendChild(button);
});
</script>

</body>
</html>
