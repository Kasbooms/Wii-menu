
<!DOCTYPE html>
<html>
<head>
    <title>Wii Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #F9F7F5;
            font-family: Arial, sans-serif;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            padding: 25px;
            height: 85vh;
        }

        .channel {
            position: relative;

            background: linear-gradient(
                to bottom,
                #ffffff,
                #f8f8f8 45%,
                #e5e5e5
            );

            border: 1px solid #bbb;
            border-radius: 15px;

            box-shadow:
                inset 0 2px 3px white,
                inset 0 -2px 4px rgba(150,150,150,0.2),
                0 2px 3px rgba(0,0,0,0.15);

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            overflow: hidden;
        }

        .channel:hover {
            border-color: #5cc8ee;
            box-shadow:
                inset 0 2px 3px white,
                0 0 5px rgba(70,190,230,0.5);
        }

        .channel img {
            width: 100%;
            height: 100%;
            object-fit: fill;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 85px;
        
            background: linear-gradient(
                to bottom,
                #ffffff,
                #f3f3f3,
                #e5e5e5
            );
        
            border-top: 2px solid #d5d5d5;
        
            box-shadow:
                0 -2px 5px rgba(0,0,0,0.08);
        
            padding: 15px 25px;
        }
        
        .footer::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: -25px;
            height: 25px;
        
            background: linear-gradient(
                to bottom,
                #ffffff,
                #f3f3f3
            );
        
            border-top: 2px solid #d5d5d5;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        
            z-index: -1;
        }
        
        .footer-date {
            font-size: 25px;
            color: #777;
        }

        .footer-date {
            font-size: 25px;
            color: #777;
        }

    </style>
</head>

<body>

    <!-- Wii Channels -->
    <div class="menu" id="menu"></div>

    <!-- Wii Footer -->
    <div class="footer">

        <div class="footer-date" id="date"></div>

        <div class="footer-message">
            Message Board
        </div>

    </div>

    <script>

        // Change your channels here
        const channels = [
            { image: "images/Example.Png", url: "https://google.com" },
            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://youtube.com" },
            { image: "images/Example.Png", url: "https://example.com" },

            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" },

            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" }
        ];

        const menu = document.getElementById("menu");

        // Generate channels
        channels.forEach(channel => {

            const button = document.createElement("div");
            button.className = "channel";

            button.innerHTML = `
                <img src="${channel.image}">
            `;

            button.onclick = () => {
                window.open(channel.url, "_blank");
            };

            menu.appendChild(button);

        });

        // Automatically display today's date
        document.getElementById("date").textContent =
            new Date().toLocaleDateString("en-US", {
                month: "long",
                day: "numeric",
                year: "numeric"
            });

    </script>

</body>
</html>
