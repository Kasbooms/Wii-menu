
<!DOCTYPE html>
<html>
<head>
    <title>Wii Menu</title>
    <style>
        body {
            margin: 0;
            background: #F9F7F5;
            font-family: Arial;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            padding: 25px;
            height: 80vh;
        }

         .channel {
            position: relative;
        
            background: linear-gradient(
                to bottom,
                #ffffff,
                #f8f8f8 45%,
                #e5e5e5
            );
        
            border: 1px solid #bbb;
        
            border-radius: 25px 25px 25px 25px / 25px 25px 25px 25px;
        
            box-shadow:
                inset 0 2px 3px white,
                inset 0 -2px 4px rgba(150,150,150,0.2),
                0 2px 3px rgba(0,0,0,0.15);
        
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }

        .channel:hover {
            border-color: #5cc8ee;
        }

        .channel img {
            width: 100%;
            height: 100%;
            object-fit: fill;
        }
    </style>
</head>
<body>

<div class="menu" id="menu"></div>

<script>
// Change your channels here
const channels = [
    { image: "images/Example.Png", url: "https://google.com" },
    { image: "images/Example.Png", url: "https://example.com" },
    { image: "images/Example.Png", url: "https://youtube.com" },
    { image: "images/Example.Png", url: "https://example.com" },

    { image: "images/Example.Png", url: "https://example.com" },
    { image: "images/Example.Png", url: "https://example.com" },
    { image: "images/Example.Png", url: "https://example.com" },
    { image: "images/Example.Png", url: "https://example.com" },

    { image: "images/Example.Png", url: "https://example.com" },
    { image: "images/Example.Png", url: "https://example.com" },
    { image: "images/Example.Png", url: "https://example.com" },
    { image: "images/Example.Png", url: "https://example.com" }
];

const menu = document.getElementById("menu");

channels.forEach(channel => {
    const button = document.createElement("div");
    button.className = "channel";

    button.innerHTML = `
        <img src="${channel.image}">
    `;

    button.onclick = () => {
        window.open(channel.url, "_blank");
    };

    menu.appendChild(button);
});
</script>

</body>
</html>
