
<!DOCTYPE html>
<html>
<head>
    <title>Wii Menu</title>
    <style>
        body {
            margin: 0;
            background: #F9F7F5;
            font-family: Arial;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            padding: 25px;
            height: 80vh;
        }

        .channel {
            background: linear-gradient(
                135deg,
                #ffffff 0%,
                #eeeeee 45%,
                #d5d5d5 100%
            );
            border: 2px solid #aaa;
            border-radius: 12px;
        
            box-shadow:
                inset 2px 2px 5px #fff,
                inset -3px -3px 6px #bbb,
                0 2px 4px rgba(0,0,0,0.15);
        
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }

        .channel:hover {
            border-color: #5cc8ee;
        }

        .channel img {
            width: 100%;
            height: 100%;
            object-fit: fill;
        }
    </style>
</head>
<body>

<div class="menu" id="menu"></div>

<script>
// Change your channels here
const channels = [
    { image: "images/Example.Png", url: "https://google.com" },
    { image: "images/Example.Png", url: "https://example.com" },
    { image: "images/Example.Png", url: "https://youtube.com" },
    { image: "images/Example.Png", url: "https://example.com" },

    { image: "images/Example.Png", url: "https://example.com" },
    { image: "images/Example.Png", url: "https://example.com" },
    { image: "images/Example.Png", url: "https://example.com" },
    { image: "images/Example.Png", url: "https://example.com" },

    { image: "images/Example.Png", url: "https://example.com" },
    { image: "images/Example.Png", url: "https://example.com" },
    { image: "images/Example.Png", url: "https://example.com" },
    { image: "images/Example.Png", url: "https://example.com" }
];

const menu = document.getElementById("menu");

channels.forEach(channel => {
    const button = document.createElement("div");
    button.className = "channel";

    button.innerHTML = `
        <img src="${channel.image}">
    `;

    button.onclick = () => {
        window.open(channel.url, "_blank");
    };

    menu.appendChild(button);
});
</script>

</body>
</html>
