
<!DOCTYPE html>
<html>
<head>
    <title>Wii Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #F9F7F5;
            font-family: Arial, sans-serif;
        }

        /* Main Channel Grid */
        .menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            padding: 25px;
            height: 85vh;
        }

        /* Channel Buttons */
        .channel {
            position: relative;

            background: linear-gradient(
                to bottom,
                #ffffff,
                #f8f8f8 45%,
                #e5e5e5
            );

            border: 1px solid #bbb;
            border-radius: 15px;

            box-shadow:
                inset 0 2px 3px white,
                inset 0 -2px 4px rgba(150,150,150,0.2),
                0 2px 3px rgba(0,0,0,0.15);

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            overflow: hidden;
        }

        .channel:hover {
            border-color: #5cc8ee;
            box-shadow:
                inset 0 2px 3px white,
                0 0 5px rgba(70,190,230,0.5);
        }

        .channel img {
            width: 100%;
            height: 100%;
            object-fit: fill;
        }

        /* Footer */
        .footer {
            height: 75px;
            margin: 0 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-top: 2px solid #d5d5d5;
            padding: 0 5px;
        }

        /* Date */
        .footer-date {
            font-size: 25px;
            color: #777;
        }

        /* Message Board Button */
        .footer-message {
            width: 190px;
            height: 48px;

            border-radius: 30px;
            border: 2px solid #aaa;

            background: linear-gradient(
                to bottom,
                #ffffff,
                #e8faff 45%,
                #bceafa
            );

            box-shadow:
                inset 0 2px 3px white,
                inset 0 -2px 4px rgba(0,100,150,0.15),
                0 2px 3px rgba(0,0,0,0.15);

            display: flex;
            align-items: center;
            justify-content: center;

            color: #479bb9;
            font-size: 19px;
            cursor: pointer;
        }

        .footer-message:hover {
            border-color: #55c9ed;

            background: linear-gradient(
                to bottom,
                #ffffff,
                #e5faff,
                #a5e5fa
            );
        }

    </style>
</head>

<body>

    <!-- Wii Channels -->
    <div class="menu" id="menu"></div>

    <!-- Wii Footer -->
    <div class="footer">

        <div class="footer-date" id="date"></div>

        <div class="footer-message">
            Message Board
        </div>

    </div>

    <script>

        // Change your channels here
        const channels = [
            { image: "images/Example.Png", url: "https://google.com" },
            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://youtube.com" },
            { image: "images/Example.Png", url: "https://example.com" },

            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" },

            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" }
        ];

        const menu = document.getElementById("menu");

        // Generate channels
        channels.forEach(channel => {

            const button = document.createElement("div");
            button.className = "channel";

            button.innerHTML = `
                <img src="${channel.image}">
            `;

            button.onclick = () => {
                window.open(channel.url, "_blank");
            };

            menu.appendChild(button);

        });

        // Automatically display today's date
        document.getElementById("date").textContent =
            new Date().toLocaleDateString("en-US", {
                month: "long",
                day: "numeric",
                year: "numeric"
            });

    </script>

</body>
</html>
