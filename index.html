<!DOCTYPE html>
<html>
<head>
    <title>Wii Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #F9F7F5;
            font-family: Arial, sans-serif;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            padding: 25px;
            height: 85vh;
        }

        .channel {
            position: relative;

            background: linear-gradient(
                to bottom,
                #ffffff,
                #f8f8f8 45%,
                #e5e5e5
            );

            border: 1px solid #bbb;
            border-radius: 15px;

            box-shadow:
                inset 0 2px 3px white,
                inset 0 -2px 4px rgba(150,150,150,0.2),
                0 2px 3px rgba(0,0,0,0.15);

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            overflow: hidden;
        }

        .channel:hover {
            border-color: #5cc8ee;
            box-shadow:
                inset 0 2px 3px white,
                0 0 5px rgba(70,190,230,0.5);
        }

        .channel img {
            width: 100%;
            height: 100%;
            object-fit: fill;
        }

       .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 105px;
        
            background: linear-gradient(
                to bottom,
                #ffffff 0%,
                #fafafa 35%,
                #eeeeee 100%
            );
        
            border-top: 2px solid #d0d0d0;
        
            box-shadow:
                0 -3px 8px rgba(0,0,0,0.10),
                inset 0 2px 3px white;
        
            padding: 15px 25px;
        
            display: flex;
            align-items: center;
            justify-content: space-between;
           clip-path: polygon(
                0 20px,
                20px 0,
                calc(100% - 20px) 0,
                100% 20px,
                100% 100%,
                0 100%
            );
        }
        
        .footer-date {
            font-size: 25px;
            font-weight: normal;
            color: #777;
            letter-spacing: 1px;
        }
        
        .footer-message {
            width: 180px;
            height: 65px;
        
            background: linear-gradient(
                to bottom,
                #ffffff,
                #f5f5f5,
                #e5e5e5
            );
        
            border: 1px solid #bbb;
            border-radius: 35px;
        
            box-shadow:
                inset 0 2px 3px white,
                0 2px 4px rgba(0,0,0,0.15);
        
            display: flex;
            align-items: center;
            justify-content: center;
        
            color: #777;
            font-size: 16px;
            cursor: pointer;
        }
        
        .footer-message:hover {
            border-color: #55c9ed;
        
            box-shadow:
                inset 0 2px 3px white,
                0 0 6px rgba(70,190,230,0.5);
        }


    </style>
</head>

<body>

    <div class="menu" id="menu"></div>

        <div class="footer">
        
            <div class="footer-date" id="date"></div>
        
            <div class="footer-message">
                Message Board
            </div>
        
        </div>

    </div>

    <script>

        const channels = [
            { image: "images/Example.Png", url: "https://google.com" },
            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://youtube.com" },
            { image: "images/Example.Png", url: "https://example.com" },

            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" },

            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" },
            { image: "images/Example.Png", url: "https://example.com" }
        ];

        const menu = document.getElementById("menu");

        channels.forEach(channel => {

            const button = document.createElement("div");
            button.className = "channel";

            button.innerHTML = `
                <img src="${channel.image}">
            `;

            button.onclick = () => {
                window.open(channel.url, "_blank");
            };

            menu.appendChild(button);

        });

        document.getElementById("date").textContent =
            new Date().toLocaleDateString("en-US", {
                month: "long",
                day: "numeric",
                year: "numeric"
            });

    </script>

</body>
</html>
